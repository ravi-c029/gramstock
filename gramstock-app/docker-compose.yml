version: "3.8"

services:
  # GramStock Cloud Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gramstock-cloud:latest
    container_name: gramstock-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gramstock?schema=public
      - STORAGE_ADAPTER=s3
      - AWS_REGION=ap-south-1
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-gramstock-cloud-dataset-2026}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gramstock-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # PostgreSQL Relational Database (Matches AWS RDS Architecture)
  db:
    image: postgres:16-alpine
    container_name: gramstock-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gramstock
    ports:
      - "5432:5432"
    volumes:
      - gramstock-db-data:/var/lib/postgresql/data
    networks:
      - gramstock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  gramstock-net:
    driver: bridge

volumes:
  gramstock-db-data:
    driver: local
